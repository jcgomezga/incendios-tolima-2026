<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Documento · Publicación Tolima</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .doc-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg),transparent 6%);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .doc-top .container{display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:10px}
    .doc-title{font-weight:800;margin-right:auto}
    .doc-wrap{max-width:920px;margin:0 auto;padding:54px 22px 90px}
    .doc-content{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,54px);box-shadow:var(--shadow)}
    .doc-content h1,.doc-content h2,.doc-content h3{line-height:1.2;letter-spacing:-.025em}
    .doc-content h1{font-size:2.2rem}.doc-content h2{margin-top:2.2em;border-top:1px solid var(--line);padding-top:1.1em}
    .doc-content table{width:100%;border-collapse:collapse;display:block;overflow:auto;margin:18px 0}
    .doc-content th,.doc-content td{border:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
    .doc-content th{background:var(--surface-2)}
    .doc-content code{background:var(--surface-2);padding:2px 5px;border-radius:5px}
    .doc-content pre{background:var(--navy);color:white;padding:16px;border-radius:12px;overflow:auto}
    .doc-error{padding:28px;color:var(--muted)}
  </style>
</head>
<body>
  <header class="doc-top">
    <div class="container">
      <a class="button ghost small" href="./">← Publicación</a>
      <span class="doc-title" data-doc-title>Documento</span>
      <button class="icon-button" type="button" data-theme-toggle aria-label="Cambiar tema">◐</button>
    </div>
  </header>
  <main class="doc-wrap">
    <article class="doc-content" id="doc-content"><p>Cargando documento…</p></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script>
    (function(){
      const root=document.documentElement, saved=localStorage.getItem("theme"); if(saved) root.dataset.theme=saved;
      document.querySelector("[data-theme-toggle]").addEventListener("click",()=>{const n=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=n;localStorage.setItem("theme",n);});
      const p=new URLSearchParams(location.search), file=p.get("file"), title=p.get("title")||"Documento";
      document.querySelector("[data-doc-title]").textContent=title; document.title=title+" · Publicación Tolima";
      const el=document.getElementById("doc-content");
      if(!file || !file.startsWith("docs/")) { el.innerHTML='<div class="doc-error">Ruta de documento no válida.</div>'; return; }
      fetch(file).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text();}).then(md=>{
        if(window.marked){el.innerHTML=marked.parse(md);}
        else{el.textContent=md;}
      }).catch(err=>{el.innerHTML='<div class="doc-error"><strong>No fue posible abrir el documento.</strong><br>'+String(err)+'</div>';});
    })();
  </script>
</body>
</html>
