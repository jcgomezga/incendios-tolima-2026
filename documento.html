<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Documento · Publicación Tolima</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="doc-top">
    <div class="container">
      <a class="button ghost small" href="./">← Publicación</a>
      <span class="doc-title" data-doc-title>Documento</span>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema" aria-pressed="false">Oscuro</button>
    </div>
  </header>
  <main class="doc-wrap">
    <article class="doc-content" id="doc-content"><p>Cargando documento…</p></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function(){
      const p=new URLSearchParams(location.search), file=p.get("file"), title=p.get("title")||"Documento";
      document.querySelector("[data-doc-title]").textContent=title; document.title=title+" · Publicación Tolima";
      const el=document.getElementById("doc-content");
      if(!file || !file.startsWith("docs/")) { el.innerHTML='<div class="doc-error">Ruta de documento no válida.</div>'; return; }
      fetch(file).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text();}).then(md=>{
        if(window.marked){el.innerHTML=marked.parse(md);}
        else{el.textContent=md;}
      }).catch(err=>{el.innerHTML='<div class="doc-error"><strong>No fue posible abrir el documento.</strong><br>'+String(err)+'</div>';});
    })();
  </script>
</body>
</html>
